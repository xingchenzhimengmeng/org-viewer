<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Org Viewer - Document Previewer</title>
  <link rel="stylesheet" href="../styles/github-theme.css">
  <link rel="stylesheet" href="../styles/toc.css">
  <link rel="stylesheet" href="../styles/print.css">
  <link rel="stylesheet" href="../styles/phycat-theme.css">
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <!-- Dropzone / Input Screen -->
  <div class="drop-screen" id="drop-screen">
    <div class="drop-card">
      <div class="drop-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6E41A4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="12" y1="18" x2="12" y2="12"></line>
          <line x1="9" y1="15" x2="12" y2="12"></line>
          <line x1="15" y1="15" x2="12" y2="12"></line>
        </svg>
      </div>
      <h2 class="drop-title">Drop your .org file here</h2>
      <p class="drop-subtitle">or browse from your computer, or paste Org-mode text below</p>

      <div class="drop-actions">
        <label class="btn btn-primary file-btn">
          <span>Choose .org File</span>
          <input type="file" id="file-input" accept=".org" style="display:none;" />
        </label>
        <button class="btn btn-secondary" id="btn-load-sample">Load Sample</button>
      </div>
      <p class="file-error" id="file-error" role="alert"></p>

      <div class="paste-section">
        <div class="divider"><span>OR PASTE TEXT</span></div>
        <textarea id="paste-input" placeholder="* Paste your Org-mode text here...&#10;** Section 1&#10;- [ ] Task item"></textarea>
        <button class="btn btn-primary" id="btn-render-paste" style="width:100%;margin-top:10px;">Render Org Text</button>
      </div>
    </div>
  </div>

  <!-- Viewer Output Container -->
  <div id="viewer-container" style="display:none;"></div>

  <script type="module" src="viewer.js"></script>
</body>
</html>
